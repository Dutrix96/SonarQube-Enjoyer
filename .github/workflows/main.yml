# .github/workflows/ci.yml

name: CI - Análisis de Código

# 1. Cuándo se ejecuta el flujo de trabajo
on:
  push:
    branches:
      - main  # Ejecuta en push a la rama principal
      - develop # También en la rama de desarrollo
  pull_request:
    branches:
      - main  # Ejecuta en pull requests hacia la rama principal
      - develop

# 2. Qué trabajos (jobs) se van a ejecutar
jobs:
  test-and-lint:
    # El tipo de máquina donde se ejecutará
    runs-on: ubuntu-latest
    
    # Estrategia para probar en múltiples versiones de Python
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Puedes añadir o quitar versiones

    # 3. Pasos (steps) que componen el trabajo
    steps:
      # Paso 1: Descargar tu código en la máquina virtual
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar el entorno de Python
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Paso 3: Instalar las dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install black pytest
          # Si usas un fichero requirements.txt, descomenta la siguiente línea:
          # pip install -r requirements.txt

      # Paso 4: Comprobar el formateo con Black
      - name: Comprobar formateo con Black
        run: |
          black --check .

      # Paso 5: Ejecutar los tests (pytest)
      - name: Ejecutar tests
        run: |
          pytest
