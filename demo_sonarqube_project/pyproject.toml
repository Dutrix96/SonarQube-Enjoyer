[tool.black]
line-length = 80
target-version = ["py311"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM","PL"]
ignore = ["E501"]  # lo controla Black

# Ignorar "magic values" sólo en tests
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
line_length = 80
