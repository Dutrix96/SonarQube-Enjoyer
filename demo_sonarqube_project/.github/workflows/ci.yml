name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==24.8.0 ruff==0.6.9 isort==5.13.2

      - name: Black (check)
        run: black --check .

      - name: Ruff (lint)
        run: ruff check .

      - name: isort (check)
        run: isort --check-only .

      - name: Pytest + coverage (xml)
        run: |
          pytest --maxfail=1 --disable-warnings -q                 --cov=src --cov-report=xml
